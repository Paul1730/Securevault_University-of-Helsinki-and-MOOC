{% extends "vault/base.html" %}
{% block title %}Security settings{% endblock %}
{% block content %}
<div class="card">
  <h1>Security settings</h1>
  <h2>Backup PIN</h2>
  <p>Current PIN: <code>{{ pin_display|default:"(not set)" }}</code></p>
  <form method="post">{% csrf_token %}
    <label for="pin">New 4-digit PIN</label><input id="pin" name="pin" inputmode="numeric" maxlength="4">
    <button type="submit">Save PIN</button>
  </form>
</div>
<div class="card">
  <h2>Change password</h2>
  <form method="post">{% csrf_token %}
    <label for="np">New password</label><input id="np" name="new_password" type="password">
    <button type="submit">Change password</button>
  </form>
</div>
{% endblock %}
